appId: com.saaramrani.moneymonitor.mobile
name: All root tabs are reachable
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- tapOn: 'Explore, tab, 3 of 4'
- assertVisible:
    id: explore-screen
- assertVisible:
    id: cashflow-chart
- assertVisible: 'What changed'
- tapOn: 'Home, tab, 1 of 4'
- assertVisible:
    id: home-screen
- tapOn: 'Activity, tab, 2 of 4'
- assertVisible:
    id: activity-screen
