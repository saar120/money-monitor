appId: com.saaramrani.moneymonitor.mobile
name: Pull-to-refresh belongs to the initiating tab
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
      MM_FIXTURE_REFRESH_DELAY_MS: 10000
- assertVisible:
    id: home-screen
- swipe:
    start: 50%, 20%
    end: 50%, 78%
    duration: 600
- tapOn: 'Activity, tab, 2 of 3'
- extendedWaitUntil:
    visible:
      id: activity-screen
    timeout: 1000
