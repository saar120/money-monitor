appId: com.saaramrani.moneymonitor.mobile
name: Review reaches financial inbox zero
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: review-heavy
- tapOn: Home
- scrollUntilVisible:
    element:
      id: start-review
    direction: DOWN
- tapOn:
    id: start-review
- assertVisible:
    id: review-screen
- assertVisible: '8 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '7 transactions to review'
- tapOn:
    id: review-category
- assertVisible: 'Choose category'
- tapOn:
    id: category-option-Dining
- assertVisible: '6 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '5 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '4 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '3 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '2 transactions to review'
- tapOn:
    id: looks-right
- assertVisible: '1 transaction to review'
- tapOn:
    id: looks-right
- assertVisible:
    id: review-complete
- assertVisible: 'All caught up'
- tapOn: 'Done'
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: start-review
