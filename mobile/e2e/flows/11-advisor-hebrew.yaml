appId: com.saaramrani.moneymonitor.mobile
name: Advisor renders and explores a Hebrew reply
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
      MM_ADVISOR_HEBREW_PREVIEW: '1'
- tapOn: 'Advisor, tab, 4 of 4'
- assertVisible:
    id: advisor-table
- assertVisible:
    id: advisor-chart
- tapOn: 'מזון, ₪2,850'
- assertVisible: 'מזון · ₪2,850'
# Opening a conversation lands on the end of the latest reply; the question is above it.
- scrollUntilVisible:
    element: 'על מה הוצאתי הכי הרבה בחודש 2026-09?'
    direction: UP
- tapOn:
    id: advisor-input
- inputText: 'איך השתנו ההוצאות שלי?'
- assertVisible: 'איך השתנו ההוצאות שלי?'
