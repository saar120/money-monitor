appId: com.saaramrani.moneymonitor.mobile
name: Home renders the normal fixture
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- assertVisible:
    id: home-screen
- assertVisible: '₪18,920'
- assertVisible: '₪700 slower than last month’s pace'
- assertVisible: '₪27,000'
- assertVisible:
    id: budget-status
- assertVisible:
    id: category-spending
- scrollUntilVisible:
    element:
      id: net-worth-summary
    direction: DOWN
- assertVisible:
    id: net-worth-summary
- swipe:
    start: 50%, 20%
    end: 50%, 78%
- assertVisible:
    id: home-primary-money
- swipe:
    start: 50%, 20%
    end: 50%, 78%
    duration: 600
- assertVisible: '₪18,920'
