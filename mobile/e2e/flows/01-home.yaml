appId: com.saaramrani.moneymonitor.mobile
name: Home renders the normal fixture
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- assertVisible:
    id: home-screen
- assertVisible: '₪18,920'
- assertVisible: '₪700 slower than last month’s pace'
- assertVisible: '₪27,000'
- assertVisible:
    id: budget-status
- swipe:
    start: 90%, 48%
    end: 10%, 48%
    duration: 450
- assertVisible:
    id: home-category-donut
- tapOn:
    id: home-donut-category-Housing
- assertVisible:
    id: category-detail
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: net-worth-summary
    direction: DOWN
- assertVisible:
    id: net-worth-summary
- swipe:
    start: 50%, 20%
    end: 50%, 78%
- assertVisible:
    id: home-primary-money
- swipe:
    start: 50%, 20%
    end: 50%, 78%
    duration: 600
- assertVisible: '₪18,920'
- tapOn:
    id: home-month-picker
- tapOn:
    id: month-option-2026-08
- assertVisible: '₪19,620'
