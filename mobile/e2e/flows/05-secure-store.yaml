appId: com.saaramrani.moneymonitor.mobile
name: Secure credential lifecycle works
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- openLink: 'moneymonitor://foundation'
- assertVisible: 'Ready. No credential operation has run.'
- tapOn: 'Store dummy credential'
- assertVisible: 'Dummy pairing credential stored in the iOS Keychain.'
- tapOn: 'Read credential'
- assertVisible: 'Read credential for 11111111…'
- tapOn: 'Delete credential'
- assertVisible: 'Pairing credential deleted.'
- tapOn: 'Read credential'
- assertVisible: 'No pairing credential is stored.'
