appId: com.saaramrani.moneymonitor.mobile
name: Explore cards open month-aware drill-downs
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: category-shift
- tapOn: 'Explore, tab, 3 of 3'
- assertVisible:
    id: explore-card-categories
- assertVisible:
    id: explore-card-monthly
- tapOn:
    id: explore-card-categories
- assertVisible:
    id: categories-screen
- tapOn: 'Previous month'
- tapOn: 'Next month'
- tapOn:
    id: category-row-Dining
- assertVisible: 'Top merchants'
- tapOn:
    id: category-merchant-Wolt
- assertVisible: 'Transactions'
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible: 'Top merchants'
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: categories-screen
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: explore-screen
- tapOn:
    id: explore-card-monthly
- assertVisible:
    id: monthly-comparison-screen
- tapOn: '1Y'
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- tapOn:
    id: explore-card-budgets
- assertVisible:
    id: budgets-screen
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- scrollUntilVisible:
    element:
      id: explore-card-cash-flow
    direction: DOWN
- tapOn:
    id: explore-card-cash-flow
- assertVisible:
    id: cash-flow-total
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- scrollUntilVisible:
    element:
      id: explore-card-net-worth
    direction: DOWN
- tapOn:
    id: explore-card-net-worth
- assertVisible:
    id: net-worth-detail
