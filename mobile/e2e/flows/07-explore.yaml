appId: com.saaramrani.moneymonitor.mobile
name: Explore explains category and merchant changes
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: category-shift
- tapOn: 'Explore, tab, 3 of 3'
- assertVisible:
    id: explore-cashflow
- assertVisible:
    id: cashflow-chart
- assertVisible: 'What changed'
- scrollUntilVisible:
    element:
      id: explore-category-Dining
    direction: DOWN
- tapOn:
    id: explore-category-Dining
- assertVisible: 'What caused the change?'
- tapOn:
    id: category-merchant-Wolt
- assertVisible: 'Transactions'
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible: 'What caused the change?'
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: explore-screen
- scrollUntilVisible:
    element:
      id: explore-category-Other
    direction: DOWN
- tapOn:
    id: explore-category-Other
- assertVisible: '₪2,480'
- assertVisible: 'Net received this month'
- assertVisible: '₪2,511 less spent than this point last month'
- assertVisible: 'Friend repayment'
