appId: com.saaramrani.moneymonitor.mobile
name: Activity search filters and detail
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- tapOn: 'Activity, tab, 2 of 3'
- assertVisible:
    id: activity-screen
- assertVisible: Today
- assertVisible: Yesterday
- assertVisible:
    id: transaction-txn-wolt
- assertVisible:
    id: transaction-txn-salary
- tapOn: 'Merchant, category, or account'
- inputText: Apple
- assertVisible:
    id: transaction-txn-apple
- assertNotVisible:
    id: transaction-txn-wolt
- eraseText
- assertVisible:
    id: transaction-txn-wolt
- tapOn:
    id: activity-filter-review
- assertVisible:
    id: transaction-txn-superpharm
- scrollUntilVisible:
    element:
      id: transaction-txn-booking
    direction: DOWN
- assertNotVisible:
    id: transaction-txn-apple
- scrollUntilVisible:
    element:
      id: transaction-txn-superpharm
    direction: UP
- tapOn:
    id: transaction-txn-superpharm
- assertVisible:
    id: transaction-detail
- assertVisible: '−₪214.90'
- assertVisible: 'סופר־פארם'
- assertVisible: '.*Category, Health.*'
- assertVisible: 'Isracard · 3098'
- assertVisible: 'Household'
- assertVisible: 'Needs review'
- tapOn:
    id: transaction-category
- assertVisible: 'Change category'
- tapOn:
    id: category-option-Groceries
- assertVisible: '.*Category, Groceries.*'
- tapOn:
    id: transaction-effective-date
- tapOn: 'Monday, 7 September'
- assertVisible:
    id: transaction-effective-date
- swipe:
    start: 3%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: activity-screen
- assertVisible: '.*Groceries.*Isracard · 3098.*'
