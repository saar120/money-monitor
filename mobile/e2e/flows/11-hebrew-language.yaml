appId: com.saaramrani.moneymonitor.mobile
name: Hebrew setting persists and root screens remain reachable in RTL
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- assertVisible:
    id: home-screen
- tapOn:
    id: open-settings
- tapOn:
    id: language-he
- assertVisible: בוקר טוב
- stopApp
- launchApp:
    arguments:
      MM_FIXTURE_SCENARIO: normal
- assertVisible: בוקר טוב
- tapOn: 'פעילות, לשונית 2 מתוך 3'
- assertVisible:
    id: activity-screen
- tapOn: 'סקירה, לשונית 3 מתוך 3'
- assertVisible:
    id: explore-screen
- tapOn:
    id: explore-card-monthly
- assertVisible:
    id: monthly-comparison-screen
