appId: com.saaramrani.moneymonitor.mobile
name: Hebrew setting persists and root screens remain reachable in RTL
---
- launchApp:
    clearState: true
    arguments:
      MM_FIXTURE_SCENARIO: normal
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- tapOn:
    id: open-settings
- tapOn:
    id: language-he
# Changing language stays on Settings, where the restart note appears.
- assertVisible: שפת האפליקציה
- assertVisible:
    id: language-he
- stopApp
- launchApp:
    arguments:
      MM_FIXTURE_SCENARIO: normal
- tapOn:
    id: tab-home
- assertVisible: סך ההוצאות
- tapOn: 'פעילות, לשונית 2 מתוך 4'
- assertVisible:
    id: activity-screen
- tapOn: 'סקירה, לשונית 3 מתוך 4'
- assertVisible:
    id: explore-screen
- tapOn:
    id: explore-card-monthly
- assertVisible:
    id: monthly-comparison-screen
- tapOn: 'יועץ, לשונית 4 מתוך 4'
- assertVisible:
    id: advisor-screen
- assertVisible: 'הוצאות לפי קטגוריה · 2026-09'
# Language is kept in the Keychain across clearState, so leave English for later flows.
- tapOn:
    id: tab-home
- tapOn:
    id: open-settings
- tapOn:
    id: language-en
- assertVisible: 'App language'
- stopApp
